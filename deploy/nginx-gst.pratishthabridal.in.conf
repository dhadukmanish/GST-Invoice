# Host nginx server block → /etc/nginx/sites-available/gst.pratishthabridal.in
# Then: ln -s ../sites-available/gst.pratishthabridal.in /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Then: certbot --nginx -d gst.pratishthabridal.in --non-interactive --redirect && nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name gst.pratishthabridal.in;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
